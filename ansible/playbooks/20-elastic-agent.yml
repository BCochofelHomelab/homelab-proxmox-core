---
# Elastic Agent on every host whose groups set elastic_agent_policy_id
# (group_vars), enrolled into homelab-proxmox-platform's Fleet with the
# group's token (group_vars/<group>.sops.yaml). The Proxmox node pve1 isn't
# in the inventory: its agent is set up by hand
# (docs/EXTERNAL-DEPENDENCIES.md).
- name: Elastic Agent
  hosts: all
  gather_facts: false
  roles:
    - role: elastic_agent
      when: elastic_agent_policy_id is defined
