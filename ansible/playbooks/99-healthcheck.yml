---
# Two kinds of checks:
# - What this repo deploys (containers, CoreDNS/Pihole on port 53, Caddy
#   serving a valid cert): a failure stops the playbook.
# - External dependencies this repo doesn't deploy (the backends behind
#   caddy_sites, the QNAP secondaries, the Elastic Agents' enrollment in
#   the platform's Fleet): a failure is reported (shown as
#   failed, then ignored) and collected into _external_issues, which the
#   last play prints as a summary.

- name: DNS health check
  hosts: dns
  gather_facts: false
  tasks:
    - name: Confirm the coredns container is running
      community.docker.docker_container_info:
        name: coredns
      register: _coredns_info
      failed_when: not _coredns_info.container.State.Running

    - name: Confirm the pihole container is running
      community.docker.docker_container_info:
        name: pihole
      register: _pihole_info
      failed_when: not _pihole_info.container.State.Running

    # Delegated to the control machine, not the dns VM itself: Docker's
    # macvlan driver cannot be reached from its own Docker host by design
    # (a well-documented upstream limitation, not specific to this setup),
    # so checking from here also happens to be the more meaningful test —
    # it's the same vantage point a real LAN client has.
    - name: Wait for CoreDNS to answer on port 53
      ansible.builtin.wait_for:
        host: "{{ coredns_ip }}"
        port: 53
        timeout: 30
      delegate_to: localhost
      check_mode: false # read-only: a TCP connect to port 53
      become: false

    - name: Wait for Pihole to answer on port 53
      ansible.builtin.wait_for:
        host: "{{ pihole_ip }}"
        port: 53
        timeout: 30
      delegate_to: localhost
      check_mode: false # read-only: a TCP connect to port 53
      become: false

    # External: set up by hand in QNAP Container Station
    # (docs/EXTERNAL-DEPENDENCIES.md).
    - name: Check the QNAP secondaries answer on port 53 (external)
      ansible.builtin.wait_for:
        host: "{{ item.ip }}"
        port: 53
        timeout: 10
      loop:
        - { name: "CoreDNS secondary", ip: "{{ coredns_secondary_ip }}", doc: docs/EXTERNAL-DEPENDENCIES.md#coredns-secondary }
        - { name: "Pihole secondary", ip: "{{ pihole_secondary_ip }}", doc: docs/EXTERNAL-DEPENDENCIES.md#pi-hole-secondary }
      loop_control:
        label: "{{ item.name }} ({{ item.ip }})"
      register: _secondaries
      check_mode: false # read-only: a TCP connect to port 53
      ignore_errors: true
      delegate_to: localhost
      become: false

    - name: Collect unreachable secondaries
      ansible.builtin.set_fact:
        _external_issues: >-
          {{ _external_issues | default([])
             + [item.item.name ~ ' (' ~ item.item.ip ~ '): not answering on port 53, see ' ~ item.item.doc] }}
      loop: "{{ _secondaries.results | selectattr('failed', 'defined') | selectattr('failed') | list }}"
      loop_control:
        label: "{{ item.item.name }}"

- name: Caddy health check
  hosts: caddy
  gather_facts: false
  vars:
    _backend_ok: [200, 301, 302, 401, 403]
  tasks:
    - name: Confirm the caddy container is running
      community.docker.docker_container_info:
        name: caddy
      register: _caddy_info
      failed_when: not _caddy_info.container.State.Running

    # In --check (the dry-run), nothing is applied: a site this change adds
    # has no DNS record and no Caddy config yet, so it can't answer. Only
    # the sites in the Caddyfile already on the host are checked then; the
    # new ones are listed, and checked by the run that applies them.
    - name: Read the deployed Caddyfile (check mode)
      ansible.builtin.slurp:
        src: "{{ caddy_base_dir }}/Caddyfile"
      register: _deployed_caddyfile
      when: ansible_check_mode

    - name: Choose the sites to check
      ansible.builtin.set_fact:
        _sites_checked: >-
          {{ caddy_sites if not ansible_check_mode
             else caddy_sites | selectattr('fqdn', 'in', _live_fqdns) | list }}
      vars:
        _live_fqdns: >-
          {{ (_deployed_caddyfile.content | default('') | b64decode).splitlines()
             | select('match', '^[a-z0-9.-]+ [{]$')
             | map('regex_replace', ' [{]$', '') | list }}

    - name: List sites this change adds (check mode, checked after apply)
      ansible.builtin.debug:
        msg: "{{ item.fqdn }}: new in this change, not deployed yet, so not checked"
      loop: "{{ caddy_sites | difference(_sites_checked) }}"
      loop_control:
        label: "{{ item.fqdn }}"

    # Status -1 means no HTTPS answer with a valid cert (connection or TLS
    # failure) — Caddy's problem, so retried while ACME issuance completes
    # on a fresh VM. Any real HTTP status means Caddy is fine; whether the
    # backend behind it is up is judged in the next tasks. Never retry on
    # `status is defined`: uri always returns one (-1 on failure).
    - name: Wait for Caddy to serve each site with a valid cert
      ansible.builtin.uri:
        url: "https://{{ item.fqdn }}/"
        validate_certs: true
        # Judge Caddy's own answer: following a backend's redirect (e.g. to
        # its own hostname or IP) would test the backend's cert, not Caddy's.
        follow_redirects: none
      loop: "{{ _sites_checked }}"
      loop_control:
        label: "{{ item.fqdn }}"
      register: _sites
      check_mode: false # read-only: an HTTPS GET of each site
      failed_when: false
      until: _sites.status != -1
      retries: 20
      delay: 15

    - name: Fail on sites Caddy can't serve
      ansible.builtin.fail:
        msg: "{{ item.item.fqdn }}: no valid HTTPS answer from Caddy ({{ item.msg | default('connection failed') }})"
      loop: "{{ _sites.results | selectattr('status', 'equalto', -1) | list }}"
      loop_control:
        label: "{{ item.item.fqdn }}"

    # Caddy answers 502 (unreachable) or 504 (timeout) when the backend is
    # down; anything else outside _backend_ok is the backend's own answer.
    - name: Report sites whose backend isn't ready (external)
      ansible.builtin.fail:
        msg: "{{ item.item.fqdn }}: backend {{ item.item.upstream }} answered HTTP {{ item.status }}"
      loop: "{{ _sites.results | rejectattr('status', 'equalto', -1) | rejectattr('status', 'in', _backend_ok) | list }}"
      loop_control:
        label: "{{ item.item.fqdn }}"
      ignore_errors: true

    - name: Collect sites whose backend isn't ready
      ansible.builtin.set_fact:
        _external_issues: >-
          {{ _external_issues | default([])
             + [item.item.fqdn ~ ': backend ' ~ item.item.upstream ~ ' answered HTTP ' ~ item.status
                ~ ', see docs/EXTERNAL-DEPENDENCIES.md'] }}
      loop: "{{ _sites.results | rejectattr('status', 'equalto', -1) | rejectattr('status', 'in', _backend_ok) | list }}"
      loop_control:
        label: "{{ item.item.fqdn }}"

# Each agent's own status, as an external dependency: whether it's enrolled
# and connected depends on homelab-proxmox-platform's Fleet Server, and its
# health on the policy Fleet sends it. state and FleetState 2: healthy and
# connected.
- name: Elastic Agent health check
  hosts: all
  gather_facts: false
  tasks:
    - name: Check the agent of each host with a Fleet policy
      when: elastic_agent_policy_id is defined
      block:
        - name: Check whether the agent is installed
          ansible.builtin.stat:
            path: /usr/bin/elastic-agent
          become: true
          register: _agent_binary

        # In --check, nothing is installed: a new agent is checked by the
        # run that installs it.
        - name: Say the agent isn't installed yet (check mode, checked after apply)
          ansible.builtin.debug:
            msg: "Elastic Agent: not installed yet, so not checked"
          when: ansible_check_mode and not _agent_binary.stat.exists

        - name: Wait for the agent to be healthy and connected to Fleet
          ansible.builtin.command:
            argv: [/usr/bin/elastic-agent, status, --output, json]
          become: true
          register: _agent_health
          check_mode: false # read-only: prints the agent's status
          changed_when: false
          failed_when: false
          until: >-
            _agent_health.rc == 0
            and ((_agent_health.stdout | from_json).info.is_managed | default(false))
            and (_agent_health.stdout | from_json).state | default(0) == 2
            and (_agent_health.stdout | from_json).FleetState | default(0) == 2
          retries: 12
          delay: 10
          when: _agent_binary.stat.exists

        - name: Describe the agent's state
          ansible.builtin.set_fact:
            _agent_issue: >-
              {{ 'not installed: its install failed (the Elastic Agent play above)'
                   if not _agent_binary.stat.exists
                 else '`elastic-agent status` fails (rc ' ~ _agent_health.rc ~ '; journalctl -u elastic-agent)'
                   if _agent_health.rc != 0
                 else 'not enrolled in Fleet: its enrollment failed (the Elastic Agent play above)'
                   if not (_status.info.is_managed | default(false))
                 else 'agent ' ~ _status.message | default('?') ~ ', Fleet ' ~ _status.FleetMessage | default('?')
                   if _status.state | default(0) != 2 or _status.FleetState | default(0) != 2
                 else '' }}
          vars:
            _status: "{{ _agent_health.stdout | from_json if _agent_health.rc | default(1) == 0 else {} }}"
          when: not (ansible_check_mode and not _agent_binary.stat.exists)

        - name: Report an agent that isn't ready (external)
          ansible.builtin.fail:
            msg: "Elastic Agent ({{ elastic_agent_policy_id }}): {{ _agent_issue }}"
          when: _agent_issue | default('') | length > 0
          ignore_errors: true

        - name: Collect an agent that isn't ready
          ansible.builtin.set_fact:
            _external_issues: >-
              {{ _external_issues | default([])
                 + [inventory_hostname ~ ': Elastic Agent (Fleet policy ' ~ elastic_agent_policy_id ~ '): '
                    ~ _agent_issue ~ ', see docs/EXTERNAL-DEPENDENCIES.md#fleet-server'] }}
          when: _agent_issue | default('') | length > 0

- name: External dependencies summary
  hosts: all
  gather_facts: false
  tasks:
    - name: Summarize external dependencies that aren't ready
      ansible.builtin.debug:
        msg: >-
          {{ (groups['all'] | map('extract', hostvars)
              | map(attribute='_external_issues', default=[]) | flatten)
             or ['All external dependencies are ready.'] }}
      run_once: true
